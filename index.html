<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダイハツ ネイキッド DIY整備＆チョイカスタム</title>
  <meta name="description" content="ダイハツ ネイキッドをDIY整備・カーオーディオ・チョイカスタムで楽しむブログ">

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ==========================================
       RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #0b0c0e;
      color: #ffffff;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    a:hover {
      opacity: 0.85;
    }

    ul {
      list-style: none;
    }

    /* ==========================================
       HERO CONTAINER & BACKGROUND
       ========================================== */
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      /* ガレージ風のダークインダストリアル背景（暗がり・ライティングの再現） */
      background: 
        radial-gradient(circle at 75% 30%, rgba(212, 122, 24, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(30, 40, 50, 0.6) 0%, transparent 60%),
        linear-gradient(180deg, rgba(11, 12, 14, 0.85) 0%, rgba(11, 12, 14, 0.4) 40%, rgba(11, 12, 14, 0.95) 100%),
        url('https://images.unsplash.com/photo-1517524008697-84bbe3c3fd98?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- Header Navigation --- */
    nav {
      width: 100%;
      padding: 25px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-links {
      display: flex;
      gap: 40px;
    }

    .nav-links a {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #d0d3d8;
      position: relative;
    }

    .nav-links a.active,
    .nav-links a:hover {
      color: #ffffff;
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #e65c00;
    }

    .social-links {
      display: flex;
      gap: 22px;
      font-size: 1.15rem;
    }

    .social-links a {
      color: #e0e0e0;
    }

    .social-links a:hover {
      color: #f38020;
    }

    /* --- Hero Layout (2 Columns: Text & Car Image) --- */
    .hero-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 60px 60px 8%;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      z-index: 5;
      flex-grow: 1;
    }

    .hero-text-content {
      max-width: 520px;
      z-index: 2;
    }

    .hero-title {
      font-size: 3.8rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1.15;
      margin-bottom: 12px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .hero-subtitle {
      font-size: 1.35rem;
      font-weight: 700;
      color: #e0e4e8;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
    }

    .hero-description {
      font-size: 0.95rem;
      color: #a0a6b0;
      margin-bottom: 35px;
      line-height: 1.8;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #f38020 0%, #e65c00 100%);
      color: #ffffff;
      padding: 14px 34px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 6px 20px rgba(230, 92, 0, 0.45);
      transition: all 0.3s ease;
    }

    .hero-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(230, 92, 0, 0.65);
    }

    /* --- Visual Stage (Car Image Display) --- */
    .hero-visual {
      position: relative;
      flex-grow: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      max-width: 55%;
    }

    /* 写真をガレージ風になじませるカードフレーム */
    .car-image-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                  0 0 40px rgba(230, 92, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: #121417;
    }

    .car-image-container img {
      width: 100%;
      height: auto;
      display: block;
      filter: contrast(1.08) brightness(0.92);
      transition: transform 0.5s ease;
    }

    .car-image-container:hover img {
      transform: scale(1.02);
    }

    /* 写真上のダークオーバレイ・ライティング効果 */
    .car-image-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0, 0, 0, 0.3) 0%,
        transparent 50%,
        rgba(0, 0, 0, 0.4) 100%
      );
      pointer-events: none;
    }

    /* ==========================================
       WHAT'S NEW BAR (BOTTOM TICKER)
       ========================================== */
    .whats-new-bar {
      width: 100%;
      background: rgba(12, 14, 18, 0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 18px 60px;
      display: flex;
      align-items: center;
      gap: 35px;
      font-size: 0.88rem;
      z-index: 10;
    }

    .whats-new-label {
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #ffffff;
      white-space: nowrap;
    }

    .news-list {
      display: flex;
      align-items: center;
      gap: 30px;
      overflow-x: auto;
      white-space: nowrap;
      flex-grow: 1;
      scrollbar-width: none;
    }

    .news-list::-webkit-scrollbar {
      display: none;
    }

    .news-item {
      display: flex;
      align-items: center;
      gap: 15px;
      color: #d0d3d8;
    }

    .news-item:not(:last-child)::after {
      content: "|";
      color: rgba(255, 255, 255, 0.18);
      margin-left: 30px;
    }

    .news-date {
      color: #8a909a;
      font-weight: 500;
    }

    .view-all {
      margin-left: auto;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
      white-space: nowrap;
    }

    .view-all:hover {
      color: #f38020;
    }

    /* ==========================================
       RESPONSIVE DESIGN
       ========================================== */
    @media (max-width: 1024px) {
      .hero-wrapper {
        flex-direction: column-reverse;
        justify-content: center;
        padding: 20px 30px 40px;
        gap: 30px;
      }
      .hero-visual {
        max-width: 100%;
        width: 100%;
      }
      .hero-text-content {
        max-width: 100%;
      }
      .hero-title {
        font-size: 3rem;
      }
    }

    @media (max-width: 768px) {
      nav {
        padding: 20px;
      }
      .nav-links {
        display: none;
      }
      .hero-title {
        font-size: 2.3rem;
      }
      .hero-subtitle {
        font-size: 1.1rem;
      }
      .whats-new-bar {
        padding: 15px 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .news-item:not(:last-child)::after {
        display: none;
      }
      .view-all {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <div class="hero-container">

    <!-- Header Navigation -->
    <nav>
      <ul class="nav-links">
        <li><a href="index.html" class="active">HOME</a></li>
        <li><a href="#latest">DIY記事</a></li>
        <li><a href="#category">カテゴリー</a></li>
        <li><a href="#gallery">ギャラリー</a></li>
        <li><a href="#contact">お問い合わせ</a></li>
      </ul>

      <div class="social-links">
        <a href="#" aria-label="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </nav>

    <!-- Main Hero Section -->
    <main class="hero-wrapper">

      <!-- Text Side -->
      <section class="hero-text-content">
        <h1 class="hero-title">ダイハツ ネイキッド</h1>
        <h2 class="hero-subtitle">DIYで作る、自分だけのカーライフ</h2>
        <p class="hero-description">
          ネイキッドをもっと楽しく、もっと自分らしく。<br>
          DIY整備・カスタム・メンテナンスの記録を<br>
          リアルにお届けします。
        </p>
        <a href="#latest" class="hero-btn">
          記事を読む <i class="fa-solid fa-arrow-right"></i>
        </a>
      </section>

      <!-- Image Side (641.jpg) -->
      <div class="hero-visual">
        <div class="car-image-container">
          <img src="641.jpg" alt="ダイハツ ネイキッド カスタム">
        </div>
      </div>

    </main>

    <!-- Bottom What's New Bar -->
    <div class="whats-new-bar">
      <div class="whats-new-label">WHAT'S NEW</div>
      
      <ul class="news-list">
        <li class="news-item">
          <span class="news-date">2026.07.25</span>
          <a href="#">ブログをリニューアルしました！</a>
        </li>
        <li class="news-item">
          <span class="news-date">2026.07.25</span>
          <a href="#">カロッツェリアデッキ取り付け記事を公開</a>
        </li>
        <li class="news-item">
          <span class="news-date">2026.07.24</span>
          <a href="#">エアコンフィルター交換</a>
        </li>
      </ul>

      <a href="#latest" class="view-all">VIEW ALL</a>
    </div>

  </div>

</body>

</html>
