<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ダイハツ ネイキッド DIY整備＆チョイカスタム</title>

  <meta name="description"
        content="ダイハツ ネイキッドをDIY整備・カーオーディオ・チョイカスタムで楽しむブログ">

  <!-- Google Fonts -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
        rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


  <style>

    /* ========================================
       リセット
    ======================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: #050505;
      color: #ffffff;
      font-family: "Noto Sans JP", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    button {
      font: inherit;
    }


    /* ========================================
       TOPページ全体
    ======================================== */

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;

      background-image:

        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.90) 0%,
          rgba(0, 0, 0, 0.76) 22%,
          rgba(0, 0, 0, 0.42) 42%,
          rgba(0, 0, 0, 0.10) 68%,
          rgba(0, 0, 0, 0.22) 100%
        ),

        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.08) 35%,
          rgba(0, 0, 0, 0.10) 64%,
          rgba(0, 0, 0, 0.75) 100%
        ),

        url("images/naked-top.jpg");

      background-repeat: no-repeat;
      background-position: 75% center;
      background-size: cover;
    }


    /* ガレージ風の暗い質感 */

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      background:

        radial-gradient(
          circle at 72% 42%,
          rgba(255, 255, 255, 0.11),
          transparent 31%
        ),

        linear-gradient(
          120deg,
          rgba(239, 91, 12, 0.06),
          transparent 42%
        );
    }


    /* 上下の暗い影 */

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      box-shadow:
        inset 0 100px 100px rgba(0, 0, 0, 0.30),
        inset 0 -100px 120px rgba(0, 0, 0, 0.42);
    }


    /* ========================================
       ヘッダー
    ======================================== */

    .site-header {
      position: relative;
      z-index: 20;
      width: 100%;
      padding: 25px 4%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(5px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1500px, 100%);
      margin: 0 auto;
      gap: 35px;
    }


    /* ロゴ */

    .logo {
      flex-shrink: 0;
      color: #f05a0c;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(3.2rem, 4.4vw, 4.2rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.13em;
      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.9);
    }


    /* ========================================
       ナビゲーション
    ======================================== */

    .site-nav {
      margin-left: auto;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: clamp(22px, 2.8vw, 48px);
    }

    .nav-menu a {
      position: relative;
      display: block;
      padding: 11px 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;

      transition:
        color 0.25s ease,
        opacity 0.25s ease;
    }

    .nav-menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 3px;
      background: #f05a0c;
      box-shadow: 0 0 12px rgba(240, 90, 12, 0.65);
      transition: width 0.25s ease;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      color: #ffffff;
    }

    .nav-menu a:hover::after,
    .nav-menu a.active::after {
      width: 100%;
    }


    /* ========================================
       SNS
    ======================================== */

    .social-links {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .social-links a {
      color: #ffffff;
      font-size: 1.35rem;

      transition:
        color 0.25s ease,
        transform 0.25s ease;
    }

    .social-links a:hover {
      color: #f05a0c;
      transform: translateY(-3px);
    }


    /* ========================================
       スマホメニューボタン
    ======================================== */

    .menu-button {
      display: none;
      place-items: center;
      width: 46px;
      height: 46px;
      margin-left: auto;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      font-size: 1.3rem;
      cursor: pointer;
    }


    /* ========================================
       メインビジュアル
    ======================================== */

    .hero-main {
      position: relative;
      z-index: 5;
      display: flex;
      flex: 1;
      align-items: center;
      width: min(1500px, 92%);
      margin: 0 auto;
      padding: 55px 0 70px;
    }

    .hero-content {
      width: min(650px, 100%);
      padding-left: 10px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
    }


    /* ダイハツ */

    .brand-small {
      margin-bottom: 0;
      color: #ffffff;
      font-size: clamp(1.7rem, 3vw, 3rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 0.04em;
    }


    /* ネイキッド */

    .hero-title {
      margin-bottom: 23px;
      color: #ffffff;
      font-size: clamp(4.8rem, 8.5vw, 8.8rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }


    /* オレンジ線 */

    .orange-line {
      width: 75px;
      height: 3px;
      margin: 0 0 26px;
      border: 0;
      background: #f05a0c;
      box-shadow: 0 0 16px rgba(240, 90, 12, 0.7);
    }


    /* キャッチコピー */

    .hero-subtitle {
      margin-bottom: 29px;
      color: #ffffff;
      font-size: clamp(1.25rem, 2vw, 2rem);
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    .hero-subtitle .accent {
      color: #f05a0c;
      font-weight: 900;
    }


    /* 説明文 */

    .hero-description {
      max-width: 550px;
      margin-bottom: 37px;
      color: rgba(255, 255, 255, 0.91);
      font-size: clamp(0.95rem, 1.25vw, 1.12rem);
      font-weight: 500;
      line-height: 2;
      letter-spacing: 0.025em;
    }


    /* ========================================
       記事ボタン
    ======================================== */

    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 38px;
      min-width: 265px;
      padding: 19px 31px;
      border: 1px solid rgba(255, 255, 255, 0.16);

      background: linear-gradient(
        105deg,
        #f05a0c,
        #d73e00
      );

      color: #ffffff;
      font-size: 1.04rem;
      font-weight: 700;
      letter-spacing: 0.04em;

      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.42),
        0 6px 22px rgba(240, 90, 12, 0.28);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .hero-button i {
      font-size: 1.15rem;
      transition: transform 0.25s ease;
    }

    .hero-button:hover {
      transform: translateY(-3px);

      background: linear-gradient(
        105deg,
        #ff6918,
        #e64500
      );

      box-shadow:
        0 20px 48px rgba(0, 0, 0, 0.52),
        0 8px 30px rgba(240, 90, 12, 0.4);
    }

    .hero-button:hover i {
      transform: translateX(7px);
    }


    /* ========================================
       スクロール表示
    ======================================== */

    .scroll-mark {
      position: absolute;
      right: 4%;
      bottom: 38px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;

      color: rgba(255, 255, 255, 0.75);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    .scroll-mark::after {
      content: "";
      width: 1px;
      height: 50px;

      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.9),
        transparent
      );

      animation: scrollLine 1.8s ease-in-out infinite;
    }

    @keyframes scrollLine {

      0%,
      100% {
        opacity: 0.35;
        transform: scaleY(0.55);
        transform-origin: top;
      }

      50% {
        opacity: 1;
        transform: scaleY(1);
        transform-origin: top;
      }
    }


    /* ========================================
       タブレット
    ======================================== */

    @media screen and (max-width: 1150px) {

      .site-header {
        padding: 22px 3%;
      }

      .header-inner {
        gap: 20px;
      }

      .nav-menu {
        gap: 22px;
      }

      .social-links {
        gap: 15px;
        margin-left: 0;
      }

      .hero {
        background-position: 63% center;
      }

      .hero-main {
        width: 94%;
      }
    }


    /* ========================================
       スマートフォン
    ======================================== */

    @media screen and (max-width: 850px) {

      .hero {
        min-height: 100svh;

        background-image:

          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.5) 0%,
            rgba(0, 0, 0, 0.22) 31%,
            rgba(0, 0, 0, 0.72) 58%,
            rgba(0, 0, 0, 0.98) 100%
          ),

          url("images/naked-top.jpg");

        background-position: 59% center;
      }

      .site-header {
        padding: 17px 20px;
      }

      .header-inner {
        gap: 12px;
      }

      .logo {
        font-size: 1.55rem;
      }

      .menu-button {
        display: grid;
      }

      .site-nav {
        margin-left: 0;
      }

      .nav-menu {
        position: absolute;
        top: 79px;
        left: 18px;
        right: 18px;

        display: none;
        flex-direction: column;
        align-items: stretch;

        gap: 0;
        padding: 8px 20px;

        border: 1px solid rgba(255, 255, 255, 0.13);

        background: rgba(5, 5, 5, 0.97);

        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.65);

        backdrop-filter: blur(15px);
      }

      .nav-menu.open {
        display: flex;
      }

      .nav-menu li {
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      }

      .nav-menu li:last-child {
        border-bottom: 0;
      }

      .nav-menu a {
        padding: 17px 5px;
      }

      .social-links {
        display: none;
      }

      .hero-main {
        align-items: flex-end;
        width: calc(100% - 40px);
        padding: 80px 0 43px;
      }

      .hero-content {
        width: 100%;
        padding-left: 0;
      }

      .brand-small {
        font-size: 1.55rem;
      }

      .hero-title {
        margin-bottom: 17px;
        font-size: clamp(3.7rem, 17vw, 5.8rem);
      }

      .orange-line {
        margin-bottom: 20px;
      }

      .hero-subtitle {
        margin-bottom: 19px;
        font-size: 1.17rem;
      }

      .hero-description {
        margin-bottom: 27px;
        font-size: 0.9rem;
        line-height: 1.85;
      }

      .hero-button {
        min-width: 220px;
        padding: 16px 25px;
      }

      .scroll-mark {
        display: none;
      }
    }


    /* ========================================
       小さいスマートフォン
    ======================================== */

    @media screen and (max-width: 470px) {

      .hero {
        background-position: 57% center;
      }

      .hero-main {
        width: calc(100% - 30px);
      }

      .hero-title {
        font-size: 3.55rem;
      }

      .hero-subtitle {
        font-size: 1.05rem;
      }

      .hero-description br {
        display: none;
      }

      .hero-button {
        width: 100%;
      }
    }

  </style>

</head>


<body>


  <main class="hero">


    <!-- ======================================
         ヘッダー
    ======================================= -->

    <header class="site-header">

      <div class="header-inner">


        <!-- ロゴ -->

        <a href="index.html"
           class="logo">

          TSKY MODE

        </a>


        <!-- スマホ用メニューボタン -->

        <button class="menu-button"
                id="menuButton"
                type="button"
                aria-label="メニューを開く"
                aria-expanded="false">

          <i class="fa-solid fa-bars"></i>

        </button>


        <!-- ナビゲーション -->

        <nav class="site-nav"
             aria-label="メインメニュー">

          <ul class="nav-menu"
              id="navMenu">


            <li>

              <a href="index.html"
                 class="active">

                HOME

              </a>

            </li>


            <li>

              <a href="diy_deck.html">

              </a>

            </li>


            <li>

              </a>

            </li>


            <li>

              <a href="mailto:t.skymode51@gmail.com">

              </a>

            </li>


          </ul>

        </nav>


        <!-- SNSリンク -->

        <div class="social-links">


          <a href="#"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="X">

            <i class="fa-brands fa-x-twitter"></i>

          </a>


          <a href="#"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="Instagram">

            <i class="fa-brands fa-instagram"></i>

          </a>


          <a href="#"

             rel="noopener noreferrer"

          </a>

    </header>


    <!-- ======================================
         メインビジュアル
    ======================================= -->

    <section class="hero-main">

      <div class="hero-content">


        <p class="brand-small">

          ダイハツ

        </p>


        <div class="title-wrap">

  <h1 class="hero-title">
    ネイキッド
  </h1>

  <div class="orange-line"></div>

</div>


        <hr class="orange-line">


        <h2 class="hero-subtitle">

          <span class="accent">DIY</span>で作る、自分だけのカーライフ

        </h2>


        <p class="hero-description">

          ネイキッドをもっと楽しく、もっと自分らしく。<br>

          DIY整備・カスタム・メンテナンスの記録を<br>

          リアルにお届けします。

        <a href="diy_deck.html"

      </div>

  </main>


  <!-- ======================================
       スマホメニュー
  ======================================= -->

  <script>

    const menuButton =
      document.getElementById("menuButton");

    const navMenu =
      document.getElementById("navMenu");

    const menuIcon =
      menuButton.querySelector("i");


    menuButton.addEventListener(
      "click",
      function () {

        const menuIsOpen =
          navMenu.classList.toggle("open");


        menuButton.setAttribute(
          "aria-expanded",
          menuIsOpen
        );


        if (menuIsOpen) {

          menuIcon.classList.remove(
            "fa-bars"
          );

          menuIcon.classList.add(
            "fa-xmark"
          );

        } else {

          menuIcon.classList.remove(
            "fa-xmark"
          );

          menuIcon.classList.add(
            "fa-bars"
          );

        }

      }
    );


    /* メニューリンクを押したら閉じる */

    const navigationLinks =
      navMenu.querySelectorAll("a");


    navigationLinks.forEach(
      function (link) {

        link.addEventListener(
          "click",
          function () {

            navMenu.classList.remove(
              "open"
            );

            menuButton.setAttribute(
              "aria-expanded",
              "false"
            );

            menuIcon.classList.remove(
              "fa-xmark"
            );

            menuIcon.classList.add(
              "fa-bars"
            );

          }
        );

      }
    );


    /* メニュー外をクリックしても閉じる */

    document.addEventListener(
      "click",
      function (event) {

        const clickedMenuButton =
          menuButton.contains(event.target);

        const clickedNavigation =
          navMenu.contains(event.target);


        if (
          !clickedMenuButton &&
          !clickedNavigation
        ) {

          navMenu.classList.remove(
            "open"
          );

          menuButton.setAttribute(
            "aria-expanded",
            "false"
          );

          menuIcon.classList.remove(
            "fa-xmark"
          );

          menuIcon.classList.add(
            "fa-bars"
          );

        }

      }
    );

  </script>


</body>
